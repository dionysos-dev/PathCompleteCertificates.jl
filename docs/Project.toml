# The examples are executed as part of the docs build, so this environment needs
# a solver, a plotting backend and the polynomial stack on top of the
# documentation tooling. None of them is a dependency of the package, nor of the
# environment CI instantiates for the tests.
[deps]
Clarabel = "61c947e1-3e6d-4ee4-985a-eec8c727bd6e"
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
DocumenterCitations = "daee34ce-89f3-4625-b898-19384cb65244"
DynamicPolynomials = "7c1d4256-1411-5781-91ec-d7bc3513ac07"
HybridSystems = "2207ec0c-686c-5054-b4d2-543502888820"
JuMP = "4076af6c-e467-56ae-b986-b466b2749572"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Literate = "98b081ad-f1c9-55d3-8b20-4c87d4299306"
PathCompleteCertificates = "b391c707-6ba7-482f-97f4-86d517cfbcc9"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
SumOfSquares = "4b9e565b-77fc-50a5-a571-1244f986bda1"

[compat]
Documenter = "1"
DocumenterCitations = "1"
Literate = "2"
SumOfSquares = "0.7"

[sources]
PathCompleteCertificates = {path = ".."}
