# MathematicalSystems is the ecosystem's systems vocabulary and a pure interface
# -- our types subtype its AbstractSystem and extend its accessors.
# HybridSystems stays weak: it is needed only for the conversion helpers.
[deps]
MathematicalSystems = "d14a8603-c872-5ed3-9ece-53e0e82e39da"

[weakdeps]
HybridSystems = "2207ec0c-686c-5054-b4d2-543502888820"

[extensions]
PathCompleteCertificatesHybridSystemsExt = "HybridSystems"

[compat]
HybridSystems = "0.4"
MathematicalSystems = "0.14"
julia = "1.10"
