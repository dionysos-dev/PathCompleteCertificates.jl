name: format-check

on:
  push:
    branches:
      - 'master'
      - 'release-'
    tags: '*'
  pull_request:

jobs:
  build:
    # No matrix, on purpose. GitHub appends the matrix combination to the job
    # name even when `name:` is set explicitly -- a single-combination matrix
    # still reports as `format_check (1, x64, ubuntu-latest)`, which is the
    # string a branch ruleset would have to require, and which changes whenever
    # the matrix does. One combination needs no matrix, and the check is then
    # simply `format_check`.
    name: format_check
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'

      - uses: actions/checkout@v7
      - name: Install JuliaFormatter and format
        run: |
          julia -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter"))'
          julia -e 'using JuliaFormatter; format(".", verbose=true)'
      - name: Format check
        run: |
          julia -e '
          out = Cmd(`git diff --name-only`) |> read |> String
          if out == ""
              exit(0)
          else
              @error "Some files have not been formatted !!!"
              write(stdout, out)
              exit(1)
          end'
