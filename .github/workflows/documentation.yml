name: Documentation
on:
  push:
    branches: [master]
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened]
# Successive pushes to the same ref supersede one another, so cancel the build
# already in flight rather than paying for both. This is per-ref, and therefore
# NOT what keeps the `gh-pages` pushes apart — see the job-level group below.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Stable check name, for the same reason as ci-ok. Not a *required* check
    # until DOCUMENTER_KEY exists: without it the preview deployment fails on
    # every pull request, which would block all of them.
    name: docs
    runs-on: ubuntu-latest
    # Every run of this workflow writes to `gh-pages`: master to `dev/`, a pull
    # request to `previews/PR<n>`. So does doc-preview-cleanup.yml, which
    # force-pushes the whole branch. Three writers, and the group above is
    # per-ref, so it does not hold a master deploy apart from a preview deploy:
    # merge a pull request while its last preview build is still running and
    # both push, the loser dying with
    #     cannot lock ref 'refs/heads/gh-pages': is at X but expected Y
    # This group is shared by everything that writes the branch, so those runs
    # queue instead of racing. It gates the build as well as the push -- a job
    # is the smallest unit concurrency can hold -- which costs some wall clock
    # when several docs runs are outstanding, and is worth it.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      # Without it every build re-resolves and re-precompiles the whole docs
      # environment, which dominates the job.
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        shell: julia --project=docs/ {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GKSwstype: "100"
        run: julia --project=docs/ docs/make.jl
