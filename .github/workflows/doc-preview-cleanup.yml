name: Doc Preview Cleanup

# Documenter deploys a preview of the docs to `gh-pages` under `previews/PR<n>`
# for every pull request (`push_preview = true` in `docs/make.jl`). Nothing
# removes them by default, so previews accumulate forever — hundreds of stale
# directories and several gigabytes, which then dominate what a `git clone`
# transfers. This deletes a preview once its PR closes, and collapses `gh-pages`
# to a single commit so the deleted content stops shipping in the pack.
#
# Present from the first commit on purpose: retrofitting it means rewriting
# `gh-pages` history on a live repository, which is a great deal more work than
# having the workflow from the start.
on:
  pull_request:
    types: [closed]

# Shared with the deploy job in documentation.yml -- the reasoning is there.
# This job is both the branch's most destructive writer and the one that loses
# the race: it force-pushes a tree captured at checkout time, so a deploy that
# lands in between is discarded with no error at all, and closing a pull request
# whose last preview build is still running deleted a directory that the build
# then recreated fourteen seconds later. Serialising fixes both directions.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  doc-preview-cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Delete the preview and collapse the branch history
        env:
          preview_dir: previews/PR${{ github.event.number }}
        run: |
          if [ -d "${preview_dir}" ]; then
            git config user.name "Documenter.jl"
            git config user.email "documenter@juliadocs.github.io"
            git rm -rf "${preview_dir}"
            git commit -m "delete preview"
            git branch gh-pages-new $(echo "delete history" | git commit-tree HEAD^{tree})
            git push --force origin gh-pages-new:gh-pages
          fi
